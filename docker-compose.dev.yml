version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: act_angel_db
    environment:
      POSTGRES_USER: actangel
      POSTGRES_PASSWORD: actangel_dev_2026
      POSTGRES_DB: act_angel_ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
